[package]
name = "zmanager-desktop"
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
zmanager-core = { path = "../../ZManager/cli/crates/zmanager-core" }

