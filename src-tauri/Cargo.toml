[package]
name = "zmanager-desktop"
version = "1.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
openssl = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
url = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["sync", "rt", "macros"] }
unicode-normalization = "0.1"
zmanager-shell-contract = { path = "../crates/zmanager-shell-contract" }
zmanager-core = { path = "../../zmanager/crates/zmanager-core", package = "zmanager-core" }
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"] }
tauri-plugin-deep-link = "2"
tzap-core = { path = "../../tzap/crates/tzap-core" }
tzap-plugin-keywrap = { path = "../../tzap/crates/tzap-plugin-keywrap" }
tzap-plugin-signing = { path = "../../tzap/crates/tzap-plugin-signing" }

[target.'cfg(windows)'.dependencies]
png = "0.18.1"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
] }
windows-core = "0.61.2"
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
gdk = "0.18.2"
gio = "0.18.4"
glib = "0.18.5"
gtk = "0.18.2"
keyring = { version = "3.6.3", default-features = false, features = ["linux-native-sync-persistent"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }

[patch.crates-io]
zmanager-libarchive-sys = { path = "../../zmanager/crates/zmanager-libarchive-sys" }
tzap-core = { path = "../../tzap/crates/tzap-core" }
tzap-plugin-keywrap = { path = "../../tzap/crates/tzap-plugin-keywrap" }
tzap-plugin-signing = { path = "../../tzap/crates/tzap-plugin-signing" }
