[package]
name = "zmanager-desktop"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
zmanager-core = { git = "https://github.com/tzap-org/zmanager", branch = "main", package = "zmanager-core" }

[target.'cfg(windows)'.dependencies]
base64 = "0.22.1"
png = "0.18.1"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[patch."https://github.com/tzap-org/tzap"]
tzap-core = { path = "../../tzap/crates/tzap-core" }
tzap-plugin-keywrap = { path = "../../tzap/crates/tzap-plugin-keywrap" }
tzap-plugin-signing = { path = "../../tzap/crates/tzap-plugin-signing" }
