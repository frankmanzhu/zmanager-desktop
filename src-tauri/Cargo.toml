[package]
name = "zmanager-desktop"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
openssl = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["sync", "rt", "macros"] }
zmanager-shell-contract = { path = "../crates/zmanager-shell-contract" }
zmanager-core = { git = "https://github.com/tzap-org/zmanager", rev = "7bda12df8bbdc860268723555a3383fe3efc4bb7", package = "zmanager-core" }

[target.'cfg(windows)'.dependencies]
base64 = "0.22.1"
png = "0.18.1"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
] }
windows-core = "0.61.2"

[target.'cfg(target_os = "linux")'.dependencies]
gdk = "0.18.2"
gio = "0.18.4"
glib = "0.18.5"
gtk = "0.18.2"
