[workspace]
members = [
    "crates/zmanager-apple-archive",
    "crates/zmanager-core",
    "crates/zmanager-libarchive",
    "crates/zmanager-unrar",
]
resolver = "2"

[workspace.package]
version = "1.0.5"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/tzap-org/zmanager"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
