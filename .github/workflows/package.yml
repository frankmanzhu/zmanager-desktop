name: Package

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            artifact-name: zmanager-macos-arm64-ci
          - arch: x86_64
            runner: macos-15-intel
            artifact-name: zmanager-macos-x86_64-ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust target and frontend dependencies
        run: |
          brew install cmake lz4 xz
          rustup target add "${{ matrix.arch == 'arm64' && 'aarch64-apple-darwin' || 'x86_64-apple-darwin' }}"
          npm ci
          scripts/ensure-sibling-repos.sh

      - name: Run macOS migration and contract tests
        run: |
          npm run test:frontend
          npm run test:architecture
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path crates/zmanager-shell-contract/Cargo.toml
          cargo test --manifest-path crates/zmanager-public-metadata-ffi/Cargo.toml
          swift test --package-path native/macos

      - name: Build and inspect ad-hoc release bundle
        env:
          ZMANAGER_BUILD_NUMBER: ${{ github.run_number }}
          ZMANAGER_MACOS_STAGE_DIR: /tmp/zmanager-macos-ci
        run: |
          scripts/build-macos.sh --skip-tests --no-install --arch "${{ matrix.arch }}" --bundle all
          app="/tmp/zmanager-macos-ci/ZManager-$(node -p 'require("./package.json").version')-macos-${{ matrix.arch }}.app"
          scripts/release-gate-macos.sh "$app" --expected-arch "${{ matrix.arch }}" \
            --report "/tmp/zmanager-macos-ci/inspection-${{ matrix.arch }}.json"
          scripts/test-macos-register-bundle.sh "$app"
          scripts/test-release-gate-macos.sh "$app" "${{ matrix.arch }}"

      - name: Upload macOS inspection and test artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          if-no-files-found: error
          path: |
            /tmp/zmanager-macos-ci/*.app
            /tmp/zmanager-macos-ci/*.zip
            /tmp/zmanager-macos-ci/*.dmg
            /tmp/zmanager-macos-ci/inspection-*.json

  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2022
            artifact-name: zmanager-windows-x64
          - arch: arm64
            runner: windows-11-arm
            artifact-name: zmanager-windows-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare and build Windows package
        shell: pwsh
        run: |
          .\scripts\prepare-windows-static-build.ps1 `
            -Architecture ${{ matrix.arch }} `
            -InstallMissing `
            -InstallNodeModules `
            -Build

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe

  linux-deb:
    name: Linux DEB ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
            artifact-name: zmanager-linux-x64-deb
          - arch: arm64
            runner: ubuntu-22.04-arm
            artifact-name: zmanager-linux-arm64-deb

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Debian package
        shell: bash
        run: scripts/build-linux-ubuntu-deb.sh --install-deps --no-install

      - name: Upload Debian artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          if-no-files-found: error
          path: |
            /tmp/zmanager-desktop-deb/*.deb

  linux-rpm:
    name: Linux RPM ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container:
      image: fedora:latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
            artifact-name: zmanager-linux-x64-rpm
          - arch: arm64
            runner: ubuntu-22.04-arm
            artifact-name: zmanager-linux-arm64-rpm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build RPM package
        shell: bash
        run: scripts/build-linux-fedora-rpm.sh --install-deps --no-install

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          if-no-files-found: error
          path: |
            /tmp/zmanager-desktop-rpm/*.rpm
